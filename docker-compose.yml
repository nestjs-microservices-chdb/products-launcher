version: '3.8'

services:

  nats-server:
    image: nats:latest
    ports:
      - "8222:8222"



# =========================
# Client Gateway (client-gateway)
# =========================
  client-gateway:
    build: ./client-gateway
    ports:
      - ${CLIENT_GATEWAY_PORT}:${CLIENT_GATEWAY_PORT}
    volumes:
      - ./client-gateway/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NATS_SERVERS=nats://nats-server:4222
    depends_on:
      - nats-server

# =========================
# Products MS (product-ms)
# =========================
  products-ms:
    build: ./product-ms
    ports:
      - "3001:3001"
    volumes:
      - ./product-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - PORT=3001
      - NATS_SERVERS=nats://nats-server:4222
      - DATABASE_URL=file:/usr/src/app/dev.db
    depends_on:
      - nats-server


# =========================
# Orders MS (order-ms)
# =========================
  order-ms:
    build: ./order-ms
    ports:
      - "3002:3002"
    volumes:
      - ./order-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:123456@orders-db:5432/ordersdb?schema=public
      - NATS_SERVERS=nats://nats-server:4222
    depends_on:
      - orders-db
      - nats-server

# Orders DB
  orders-db:
    container_name: orders_database
    image: postgres:16.2
    restart: always
    volumes:
      - ./order-ms/postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=ordersdb

# =========================
# Payments (payments-ms)
# =========================

  payment-ms:
    build: ./payment-ms
    ports:
      - "3003:3003"
    volumes:
      - ./payment-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - PORT=3003
      - STRIPE_SECRET=sk_test_51UZ0IQJCqIrd0sBsCOg9a0XkLdshHEtmKGpXHtoTroTZnRdikc6hNtM49wkBN8ysXOZz4P2rzAwtAwp8z2RB3JJT00aM2p1W4J
      - STRIPE_WEBHOOK_SECRET=whsec_BXYe2nOvn2JmPXe8msW7f5E8NiYgKZeV
      - STRIPE_SUCCESS_URL=http://localhost:3000/payment/success
      - STRIPE_CANCEL_URL=http://localhost:3000/payment/cancel
      - NATS_SERVERS=nats://nats-server:4222
    depends_on:
      - nats-server