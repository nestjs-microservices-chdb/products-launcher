services:

  nats-server:
    image: nats:latest
    ports:
      - "8222:8222"



# =========================
# Client Gateway (client-gateway)
# =========================
  client-gateway:
    build: ./client-gateway
    ports:
      - ${CLIENT_GATEWAY_PORT}:${CLIENT_GATEWAY_PORT}
    volumes:
      - ./client-gateway/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NATS_SERVERS=${NATS_SERVERS}
    depends_on:
      - nats-server

# =========================
# Products MS (product-ms)
# =========================
  products-ms:
    build: ./product-ms
    ports:
      - "3001:3001"
    volumes:
      - ./product-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - PORT=3001
      - NATS_SERVERS=${NATS_SERVERS}
      - DATABASE_URL=file:/usr/src/app/dev.db
    depends_on:
      - nats-server


# =========================
# Orders MS (order-ms)
# =========================
  order-ms:
    build: ./order-ms
    ports:
      - "3002:3002"
    volumes:
      - ./order-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=${ORDERS_DATABASE_URL}
      - NATS_SERVERS=${NATS_SERVERS}
    depends_on:
      - orders-db
      - nats-server

# Orders DB
  orders-db:
    container_name: orders_database
    image: postgres:16.2
    restart: always
    volumes:
      - ./order-ms/postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${ORDERS_POSTGRES_USER}
      - POSTGRES_PASSWORD=${ORDERS_POSTGRES_PASSWORD}
      - POSTGRES_DB=${ORDERS_POSTGRES_DB}

# =========================
# Payments (payments-ms)
# =========================

  payment-ms:
    build: ./payment-ms
    ports:
      - "3003:3003"
    volumes:
      - ./payment-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - PORT=3003
      - STRIPE_SECRET=${STRIPE_SECRET}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL}
      - NATS_SERVERS=${NATS_SERVERS}
    depends_on:
      - nats-server

# =========================
# Authentication (auth-ms)
# =========================

  auth-ms:
    build: ./auth-ms
    ports:
      - "3004:3004"
    volumes:
      - ./auth-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - PORT=3004
      - NATS_SERVERS=${NATS_SERVERS}
      - AUTH_MS_DB_URL=${AUTH_MS_DB_URL}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
    depends_on:
      - nats-server


# =========================
# MONGODB
# =========================

  mongodb:
    image: mongo:8.3
    container_name: mongodb
    restart: always
    command: ["--replSet", "rs0"]
    ports:
      - "27017:27017"
    volumes:
      - ./auth-ms/mongo_data:/data/db